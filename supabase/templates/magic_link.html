<div style="font-family:-apple-system,Segoe UI,Roboto,sans-serif;max-width:440px;margin:0 auto;padding:32px 24px;background:#0a0f1f;color:#eef0f9;border-radius:16px">
  <div style="font-size:22px;font-weight:800;letter-spacing:0.12em">ASTRO</div>
  <p style="margin:20px 0 8px;font-size:15px;line-height:1.5">Here's your code to sign in to Astro.</p>
  <div style="margin:16px 0;font-size:34px;font-weight:800;letter-spacing:0.3em;color:#c589ff">{{ .Token }}</div>
  <p style="margin:0 0 20px;font-size:13px;color:#9aa3c7">Or tap the button on this device:</p>
  <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 20px;border-radius:10px;background:#a63fff;color:#fff;font-weight:700;text-decoration:none">Sign in to Astro</a>
  <p style="margin:24px 0 0;font-size:12px;color:#6d7496">The code and link work once and expire in an hour. Didn't ask for this? You can ignore it.</p>
</div>
