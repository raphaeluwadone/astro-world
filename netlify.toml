[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# A page file from an older deploy should 404, not get index.html, so the app can tell and reload.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# The app routes in the browser, so every path has to load index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
